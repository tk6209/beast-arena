name: Capynite contracts baseline
on:
  pull_request:
    paths:
      - 'packages/game-contracts/**'
      - 'unity/**'
      - 'docs/architecture/CAPYNITE_UNITY_DELIVERY_PROGRAM.md'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/capynite-contracts.yml'
  workflow_dispatch:
jobs:
  web-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Test web and Capynite contracts
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production compile
        run: npm run build
# Unity EditMode/WebGL testing is explicitly NOT claimed by this web-only job.
